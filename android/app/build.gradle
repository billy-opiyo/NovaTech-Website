import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('NURAVA_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('NURAVA_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('NURAVA_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('NURAVA_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def expectedProductionCertificateSha256 = System.getenv('NURAVA_ANDROID_EXPECTED_CERT_SHA256')
def productionAppId = 'com.nurava.hubstores'
def productionSiteUrl = 'https://nuravahubstores.com'

android {
    namespace = "com.nurava.hubstores"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nurava.hubstores"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.3.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def verifyProductionReleaseInputs = tasks.register('verifyProductionReleaseInputs') {
    group = 'verification'
    description = 'Checks production target, app identity, and release signing inputs before release packaging.'
    doLast {
        if (System.getenv('NURAVA_ANDROID_RELEASE_WRAPPER') != '1') {
            throw new GradleException('Use npm run android:release:apk or npm run android:release:aab so the finished artifact is verified before distribution.')
        }
        if (System.getenv('NURAVA_ANDROID_PRODUCTION_RELEASE_ENABLED') != '1') {
            throw new GradleException('Production APK/AAB generation is disabled. Enable it only after the production site is deployed and the release is approved.')
        }
        if (System.getenv('CAPACITOR_BUILD_TARGET') != 'production') {
            throw new GradleException('Production release requires CAPACITOR_BUILD_TARGET=production. Use npm run android:release:apk or npm run android:release:aab.')
        }
        if (System.getenv('CAPACITOR_SERVER_URL') != productionSiteUrl) {
            throw new GradleException('Production release requires the approved https://nuravahubstores.com Capacitor URL.')
        }

        def generatedConfigFile = file('src/main/assets/capacitor.config.json')
        if (!generatedConfigFile.isFile()) {
            throw new GradleException('Production release requires a synchronized Capacitor Android config. Run the production npm release command.')
        }
        def generatedConfig
        try {
            generatedConfig = new JsonSlurper().parse(generatedConfigFile)
        } catch (Exception ignored) {
            throw new GradleException('The generated Android Capacitor config is invalid JSON.')
        }
        if (generatedConfig?.server?.url != productionSiteUrl || generatedConfig?.server?.cleartext != false || generatedConfig?.appId != productionAppId) {
            throw new GradleException('The generated Android Capacitor config does not match the production HTTPS URL, cleartext setting, and package ID.')
        }
        if (android.defaultConfig.applicationId != productionAppId) {
            throw new GradleException('Production release package ID must remain com.nurava.hubstores.')
        }
        if (!(android.defaultConfig.versionCode instanceof Number) || android.defaultConfig.versionCode < 1
            || !(android.defaultConfig.versionName instanceof String) || !android.defaultConfig.versionName.trim()) {
            throw new GradleException('Production release requires a positive version code and a non-empty version name.')
        }

        def signingValues = [
            NURAVA_ANDROID_KEYSTORE: releaseStoreFile,
            NURAVA_ANDROID_STORE_PASSWORD: releaseStorePassword,
            NURAVA_ANDROID_KEY_ALIAS: releaseKeyAlias,
            NURAVA_ANDROID_KEY_PASSWORD: releaseKeyPassword,
        ]
        def missingValues = signingValues.findAll { name, value -> !value || !value.trim() }.keySet()
        if (!missingValues.isEmpty()) {
            throw new GradleException("Production release signing is incomplete. Configure all four NURAVA_ANDROID_* values; missing: ${missingValues.join(', ')}. Values are not displayed.")
        }
        def keystore = new File(releaseStoreFile)
        if (!keystore.isAbsolute() || !keystore.isFile()) {
            throw new GradleException('NURAVA_ANDROID_KEYSTORE must point to an existing keystore file using an absolute path.')
        }
        def repositoryRoot = rootProject.projectDir.parentFile.canonicalFile
        if (keystore.canonicalFile.toPath().startsWith(repositoryRoot.toPath())) {
            throw new GradleException('NURAVA_ANDROID_KEYSTORE must be outside the repository.')
        }
        def expectedFingerprint = (expectedProductionCertificateSha256 ?: '').replace(':', '').trim()
        if (!(expectedFingerprint ==~ /(?i)[0-9a-f]{64}/)) {
            throw new GradleException('Set NURAVA_ANDROID_EXPECTED_CERT_SHA256 to the approved production signing certificate SHA-256 fingerprint.')
        }

        def releaseSigningConfig = android.signingConfigs.findByName('release')
        if (!releaseSigningConfig || android.buildTypes.release.signingConfig?.name != 'release') {
            throw new GradleException('Production release must use the configured release signing key; debug signing is not allowed.')
        }
    }
}

tasks.configureEach { candidate ->
    if (candidate.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        candidate.dependsOn(verifyProductionReleaseInputs)
    }
}

tasks.register('copyReleaseApk') {
    dependsOn 'assembleRelease'
    doLast {
        def signedApk = file("$buildDir/outputs/apk/release/app-release.apk")
        if (!signedApk.exists()) {
            throw new GradleException('No signed release APK was produced. Configure all four NURAVA_ANDROID_* signing variables before building a distributable APK. For staging sideloads, build and use the debug APK instead.')
        }
        copy {
            from signedApk
            into "$buildDir/outputs/apk/release"
            rename { 'nurava-hubstores.apk' }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
