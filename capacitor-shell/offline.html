<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1220" />
		<title>Connection Unavailable | Nurava HubStores</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #0b1220;
				color: #f8fafc;
			}
			* { box-sizing: border-box; }
			html, body { min-height: 100%; margin: 0; }
			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
				background: radial-gradient(ellipse at 50% 0%, #172b43 0%, #0b1220 68%);
			}
			.backdrop { position: fixed; inset: 0; background: rgb(2 6 23 / 65%); backdrop-filter: blur(8px); }
			.dialog {
				position: relative;
				width: min(100%, 28rem);
				padding: 2.25rem 1.75rem;
				text-align: center;
				border: 1px solid rgb(255 255 255 / 15%);
				border-radius: 1rem;
				background: linear-gradient(135deg, rgb(20 34 53 / 92%), rgb(22 37 57 / 82%));
				box-shadow: 0 24px 60px rgb(0 0 0 / 35%), inset 0 1px 0 rgb(255 255 255 / 6%);
				-webkit-backdrop-filter: blur(16px);
				backdrop-filter: blur(16px);
			}
			.icon { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; margin: 0 auto; border-radius: 50%; background: rgb(56 189 248 / 15%); color: #7dd3fc; }
			h1 { margin: 1.25rem 0 0; font-size: 1.375rem; line-height: 1.3; font-weight: 700; }
			p { margin: .75rem 0 0; font-size: .875rem; line-height: 1.5rem; color: #cbd5e1; }
			.description { margin-top: .5rem; color: #94a3b8; }
			@media (max-width: 360px) { .dialog { padding: 1.75rem 1.25rem; } }
		</style>
	</head>
	<body>
		<div class="backdrop" aria-hidden="true"></div>
		<main class="dialog" role="status" aria-live="assertive" aria-labelledby="offline-title" aria-describedby="offline-description">
			<div class="icon" aria-hidden="true">
				<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M2 8.8a15.5 15.5 0 0 1 20 0M5 12a10.7 10.7 0 0 1 14 0m-11 3.2a5.8 5.8 0 0 1 8 0M12 19h.01" />
					<path d="m3 3 18 18" />
				</svg>
			</div>
			<h1 id="offline-title">Connection Unavailable</h1>
			<p>Please check you Internet Connection.</p>
			<p id="offline-description" class="description">Some features may be temporarily unavailable. We’ll reconnect automatically when your connection returns.</p>
		</main>
		<script>
			(() => {
				const targetUrl = new URLSearchParams(window.location.search).get("url");
				if (!targetUrl) return;
				let checking = false;
				let retryTimer;
				const checkConnection = async () => {
					if (checking) return;
					checking = true;
					try {
						const controller = new AbortController();
						const timeout = window.setTimeout(() => controller.abort(), 8000);
						await fetch(targetUrl, { method: "GET", mode: "no-cors", cache: "no-store", signal: controller.signal });
						window.clearTimeout(timeout);
						window.location.replace(targetUrl);
					} catch {
						checking = false;
						retryTimer = window.setTimeout(checkConnection, 2000);
					}
				};
				const retryWhenVisible = () => {
					if (document.visibilityState === "visible") {
						window.clearTimeout(retryTimer);
						void checkConnection();
					}
				};
				window.addEventListener("online", retryWhenVisible);
				document.addEventListener("visibilitychange", retryWhenVisible);
				window.addEventListener("pageshow", retryWhenVisible);
				void checkConnection();
			})();
		</script>
	</body>
</html>
