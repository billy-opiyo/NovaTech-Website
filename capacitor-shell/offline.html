<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1220" />
		<title>Connection Unavailable | Nurava HubStores</title>
		<style>
			:root {
				color-scheme: dark;
				--offline-bg: #0b1220;
				--offline-surface: #172b43;
				--offline-text: #f8fafc;
				--offline-muted: #cbd5e1;
				--offline-primary: #f97316;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: var(--offline-bg);
				color: var(--offline-text);
			}
			* { box-sizing: border-box; }
			html, body { min-height: 100%; margin: 0; }
			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
				background: linear-gradient(135deg, var(--offline-surface), var(--offline-bg));
			}
			.backdrop { position: fixed; inset: 0; background: rgb(2 6 23 / 50%); backdrop-filter: blur(8px); }
			.dialog {
				position: relative;
				width: min(100%, 28rem);
				padding: 1.75rem;
				text-align: center;
				border: 0;
				border-radius: 1rem;
				background: linear-gradient(135deg, var(--offline-glass-bg, var(--offline-surface)), color-mix(in srgb, var(--offline-surface) 62%, transparent));
				box-shadow: 0 24px 60px rgb(0 0 0 / 35%);
				-webkit-backdrop-filter: blur(16px);
				backdrop-filter: blur(16px);
			}
			.icon { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; margin: 0 auto; border-radius: 50%; background: color-mix(in srgb, var(--offline-primary) 15%, transparent); color: var(--offline-primary); }
			h1 { margin: 1.25rem 0 0; font-size: 1.25rem; line-height: 1.3; font-weight: 700; }
			p { margin: .75rem 0 0; font-size: .875rem; line-height: 1.5rem; color: var(--offline-muted); }
			.description { margin-top: .5rem; }
			@media (max-width: 360px) { .dialog { padding: 1.75rem 1.25rem; } }
			@media (min-width: 640px) { .dialog { padding: 2.25rem; } h1 { font-size: 1.5rem; } }
		</style>
	</head>
	<body>
		<div class="backdrop" aria-hidden="true"></div>
		<main class="dialog" role="status" aria-live="assertive" aria-labelledby="offline-title" aria-describedby="offline-description">
			<div class="icon" aria-hidden="true">
				<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M2 8.8a15 15 0 0 1 20 0" />
					<path d="M5 13a10 10 0 0 1 14 0" />
					<path d="M8.5 16.5a5 5 0 0 1 7 0" />
					<path d="M12 20h.01" />
					<path d="m3 3 18 18" />
				</svg>
			</div>
			<h1 id="offline-title">Connection Unavailable</h1>
			<p>Please check you Internet Connection.</p>
			<p id="offline-description" class="description">Some features may be temporarily unavailable. We’ll reconnect automatically when your connection returns.</p>
		</main>
		<script>
			(() => {
				const params = new URLSearchParams(window.location.search);
				const targetUrl = params.get("url");
				const colorParameters = {
					background: "--offline-bg",
					surface: "--offline-surface",
					text: "--offline-text",
					muted: "--offline-muted",
					primary: "--offline-primary",
				};
				for (const [parameter, property] of Object.entries(colorParameters)) {
					const color = params.get(parameter);
					if (color && /^#[0-9a-f]{6}$/i.test(color)) {
						document.documentElement.style.setProperty(property, color);
					}
				}
				const glassBackground = params.get("glassBackground");
				if (glassBackground && /^rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+(?:\s*,\s*[\d.]+)?\s*\)$/.test(glassBackground)) {
					document.documentElement.style.setProperty("--offline-glass-bg", glassBackground);
				}
				const themeColor = document.querySelector('meta[name="theme-color"]');
				if (themeColor) themeColor.content = getComputedStyle(document.documentElement).getPropertyValue("--offline-bg").trim();
				if (params.get("lightIcons") === "true") document.documentElement.style.colorScheme = "light";
				if (!targetUrl) return;
				let checking = false;
				let retryTimer;
				const checkConnection = async () => {
					if (checking) return;
					checking = true;
					try {
						const controller = new AbortController();
						const timeout = window.setTimeout(() => controller.abort(), 8000);
						await fetch(targetUrl, { method: "GET", mode: "no-cors", cache: "no-store", signal: controller.signal });
						window.clearTimeout(timeout);
						window.location.replace(targetUrl);
					} catch {
						checking = false;
						retryTimer = window.setTimeout(checkConnection, 2000);
					}
				};
				const retryWhenVisible = () => {
					if (document.visibilityState === "visible") {
						window.clearTimeout(retryTimer);
						void checkConnection();
					}
				};
				window.addEventListener("online", retryWhenVisible);
				document.addEventListener("visibilitychange", retryWhenVisible);
				window.addEventListener("pageshow", retryWhenVisible);
				void checkConnection();
			})();
		</script>
	</body>
</html>
